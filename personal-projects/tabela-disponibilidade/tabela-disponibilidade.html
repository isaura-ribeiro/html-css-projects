<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Availability Table</title>
    <link rel="stylesheet" href="tabela-disponibilidade.css" />
  </head>

  <body>
    <main>
      <table>
        <caption>
          Cronograma de Disponibilidade - Reuniões Semanais
        </caption>
        <tbody>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">9:00</th>
            <th scope="col">Segunda</th>
            <th scope="col">Terça</th>
            <th scope="col">Quarta</th>
            <th scope="col">Quinta</th>
            <th scope="col">Sexta</th>
          </tr>
          <tr class="half">
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-1" aria-label="1 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">10:00</th>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">11:00</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-0" aria-label="0 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-1" aria-label="1 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">12:00</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-0" aria-label="0 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">13:00</th>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-0" aria-label="0 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">14:00</th>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">15:00</th>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-4" aria-label="4 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">16:00</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-4" aria-label="4 available"></td>
          </tr>
          <tr class="half">
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-0" aria-label="0 available"></td>
            <td class="available-4" aria-label="4 available"></td>
            <td class="available-2" aria-label="2 available"></td>
            <td class="available-5" aria-label="5+ available"></td>
          </tr>
          <tr class="sharp">
            <th rowspan="2" class="time" scope="row">17:00</th>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-5" aria-label="5+ available"></td>
            <td class="available-3" aria-label="3 available"></td>
            <td class="available-4" aria-label="4 available"></td>
          </tr>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <div id="legend">
        <span id="legend-title">Disponibilidade</span>
        <div id="legend-line">
          <span>0</span>
          <div id="legend-gradient"></div>
          <span>5+</span>
        </div>
      </div>
    </main>
  </body>
</html>
