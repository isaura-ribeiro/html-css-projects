<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="lista_tarefas_estl.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <ul class="todo-list">
        <li>
            <input type="checkbox" id="tarefa-1">
            <label for="tarefa-1">Search for Ergonomic/Gaming Mouse</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.pcdiga.com/perifericos/ratos-teclados/ratos" target="_blank">PC Diga</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="tarefa-2">
            <label for="tarefa-2">Finish Report's Intro/ Conclusion</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://github.com/isaura-ribeiro" target="_blank">Request Access to Doc</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="tarefa-3">
            <label for="tarefa-3">Search for Phone Warranty Info</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://www.google.com/search?q=phone+warranty+information&rlz=1C1FCXM_pt-PTPT953PT954&oq=phone+warranty+information+&gs_lcrp=EgZjaHJvbWUyBggAEEUYOTIICAEQABgWGB4yBwgCEAAY7wUyCggDEAAYgAQYogQyCggEEAAYgAQYogQyBwgFEAAY7wUyBwgGEAAY7wXSAQg1OTI3ajBqN6gCALACAA&sourceid=chrome&source=chrome.ob&ie=UTF-8" target="_blank">More Info</a></li>
            </ul>
        </li>
        <li>
            <input type="checkbox" id="tarefa-4">
            <label for="tarefa-4">Check for Graphics Card Specs</label>
            <ul class="sub-item">
                <li><a class="sub-item-link" href="https://chip7.pt/componentes-hardware/placas-graficas" target="_blank">View Model Number</a></li>
        </li>
    </ul>
    </div>
</body>

</html>
