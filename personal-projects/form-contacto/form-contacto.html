<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Formulário de Contacto</title>
    <link rel="stylesheet" href="form-contacto.css"></link>
</head>

<body>
    <div class="form-container">
        <form>
            <h2>Contacte-nos</h2>
            <label for="name">Nome: </label>
            <input type="text" id="name" name="name-box" required/>
            
            <label for="email">E-mail: </label>
            <input type="email" id="email" name="email-box" required/>

            <label for="message">Mensagem: </label>
            <textarea id="message" name="message-box" rows="5" required> </textarea>
            
            <button type="submit">Submit</button>
        </form>
    </div>
</body>

</html>
