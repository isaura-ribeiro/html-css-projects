<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post Card</title>
    <link href="cartao_post_blog.css" rel="stylesheet" />
  </head>
  <body>
    <div class="blog-post-card">
      <img
        class="post-img"
        src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
        alt="image of someone using a computer"
      />
      <div class="post-content">
        <h2 class="post-title">Aprende a Programar em 2026</h2>
        <p class="post-excerpt">
          Mantém-te à frente da inovação, com os novos desenvolvimentos em
          Desenvolvimento de Software.Descobre aqui, todas as novidades.
        </p>
        <a class="read-more" href="https://www.freecodecamp.org/learn"
          >Read More</a
        >
      </div>
    </div>
  </body>
</html>
